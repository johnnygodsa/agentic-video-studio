name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: System packages (ffmpeg, CJK fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk

      - name: Python packages
        run: pip install -r requirements-ci.txt

      - name: Tests (no GPU / no external backend / no models)
        run: python -X utf8 .github/run_ci_tests.py

      - name: Offline demo
        run: python -X utf8 pipeline/demo/run_demo.py --tts none --out demo_out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo
          path: |
            demo_out/demo.mp4
            demo_out/demo.srt
            demo_out/contact_sheet.png
          if-no-files-found: warn
